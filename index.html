<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Undangan Resmi — Edu Fair & Career Expo 2026 · SMKN 6 Kota Tangerang Selatan</title>
  <meta name="description" content="Undangan Digital Resmi Edu Fair dan Career Expo 2026 SMKN 6 Kota Tangerang Selatan. Connecting Competence to Future.">
  <meta name="theme-color" content="#101C25">
  <meta property="og:title" content="Edu Fair & Career Expo 2026 — SMKN 6 Kota Tangerang Selatan">
  <meta property="og:description" content="Connecting Competence to Future: Bekerja, Melanjutkan, Berwirausaha. Rabu, 25 November 2026.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23A3BBC4'%3E%3Cpath d='M12 3L1 9l11 6 9-4.91V17h2V9L12 3z'/%3E%3Cpath d='M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="cover-page">

  <main class="cover-container">
    <div class="cover-card" id="cover-card">

      <!-- Badge "Official Access Pass" -->
      <div class="cover-event-pass-badge">🎓 Official Invitation &amp; Access Pass</div>

      <!-- Label Sekolah -->
      <div class="cover-school-label">SMK Negeri 6 · Kota Tangerang Selatan</div>

      <!-- Ornamen Flourish Cyan -->
      <div class="flourish-row">
        <div class="flourish-line"></div>
        <div class="flourish-diamond"></div>
        <div class="flourish-dot"></div>
        <div class="flourish-diamond"></div>
        <div class="flourish-line r"></div>
      </div>

      <!-- Judul Utama Acara -->
      <h1 class="cover-main-title">
        <span class="title-accent">Edu Fair</span> &amp; Career Expo
        <span class="title-year">2026</span>
      </h1>

      <!-- Kutipan Tema -->
      <p class="cover-theme-quote">
        &ldquo;Connecting Competence to Future:<br>Bekerja, Melanjutkan, Berwirausaha&rdquo;
      </p>

      <!-- Kartu Penerima Undangan Personal (Dinamis dari Supabase / URL) -->
      <div class="cover-guest-card">
        <div class="cover-guest-label">Kepada Yth. Bapak / Ibu / Rekan</div>
        <div class="cover-guest-name" id="cover-guest-name">
          <span style="color: rgba(255,255,255,0.4); font-size:0.95rem; font-style:italic;">Memuat undangan…</span>
        </div>
        <div class="cover-guest-instansi" id="cover-guest-instansi"></div>
        <div id="cover-guest-badge-wrap"></div>
      </div>

      <!-- Ornamen Flourish -->
      <div class="flourish-row">
        <div class="flourish-line"></div>
        <div class="flourish-diamond"></div>
        <div class="flourish-line r"></div>
      </div>

      <!-- Tanggal & Waktu Ringkasan -->
      <div class="cover-date-row">
        <span class="date-pill">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Rabu, 25 November 2026
        </span>
        <span class="date-pill">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          07.00 – 14.20 WIB
        </span>
      </div>

      <!-- Tombol CTA Buka Undangan (Pulsing Glow) -->
      <div style="text-align:center;">
        <button type="button" id="btn-open-invitation" class="cover-cta-btn btn-cta-pulse">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          Buka Undangan
        </button>
      </div>

    </div><!-- /cover-card -->
  </main>

  <!-- Toast Container (untuk notifikasi ringan) -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/audio-player.js"></script>
  <script src="assets/js/cover.js"></script>
</body>
</html>
